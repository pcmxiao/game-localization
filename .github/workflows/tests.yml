name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      # selftest.py 是「零依赖」入口，先单独跑一遍 —— 它就是使用者会跑的东西，
      # 不依赖 pytest。这一条保证 README 里「无需第三方依赖」的说法成立。
      - name: selftest (no third-party deps)
        run: python scripts/selftest.py

      - name: pytest
        run: python -m pytest tests/ -q

  # 单独确认「没有任何第三方依赖也能跑起来」—— 与上面那个 job 分开，
  # 因为上面为了 pytest 装了包，掩盖不了依赖问题。
  no-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pipeline smoke test with stdlib only
        run: python scripts/selftest.py
